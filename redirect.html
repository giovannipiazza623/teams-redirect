<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8">
    <title>Apri Jira Service Management</title>
    <script src="https://res.cdn.office.net/teams-js/2.47.0/js/Microsoft/script>
    <style>
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin: 24px; }
      .btn { display:inline-block; padding:10px 16px; border-radius:6px; background:#0078d4; color:#fff; text-decoration:none; }
      .hint { color:#444; margin-top:12px; }
    </style>
  </head>
  <body>
    <h1>Apertura di Jira Service Management…</h1>
    <p class="hint">Se non parte in automatico, clicca qui:</p>
    <p>#Apri Jira</a></p>

    <script>
      const url = "https://tpgroup.atlassian.net/servicedesk/";

      async function tryOpen() {
        try {
          if (window.microsoftTeams?.app?.initialize) {
            await microsoftTeams.app.initialize();
          }
          if (window.microsoftTeams?.app?.openLink) {
            // API ufficiale Teams: apre fuori dal client
            microsoftTeams.app.openLink(url);
          } else {
            // Fallback (se la pagina fosse aperta fuori da Teams)
            window.open(url, "_blank", "noopener,noreferrer");
          }
        } catch(e) {
          // Se qualcosa fallisce, mostra solo il bottone
          console.warn("open failed", e);
        }
      }

      // Auto-apertura dopo initialize
      tryOpen();

      // Fallback esplicito su click (sempre disponibile)
      document.getElementById("open").addEventListener("click", (ev) => {
        ev.preventDefault();
        if (window.microsoftTeams?.app?.openLink) {
          microsoftTeams.app.openLink(url);
        } else {
          window.open(url, "_blank", "noopener,noreferrer");
        }
      });
    </script>
  </body>
</html>
