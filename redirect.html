
<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Apri Jira Service Management</title>
    <style>
      html, body { height:100%; margin:0; font-family: Arial, Helvetica, sans-serif; background:#fff; color:#1a1a1a; }
      .wrap { min-height:100%; display:grid; place-items:center; text-align:center; padding:24px; box-sizing:border-box; }
      h1 { font-size:22px; margin:0 0 8px; }
      p  { color:#444; margin:.0/js/MicrosoftTeams.min.js</script>      p  { color:#444; margin:0 0 16px; }
  </head>
  <body>
    <div class="wrap">
      <main aria-labelledby="title">
        <h1 id="title">Apri Jira Service Management</h1>
        <p>Stiamo aprendo Jira nel browser… Se non parte, usa il bottone.</p>
        <p><button id="openJira" type="button">Apri Jira</button></p>
        <p>Oppure usa questo link:
           https://tpgroup.atlassian.net/servicedesk/
             https://tpgroup.atlassian.net/servicedesk/
           </a>
        </p>
      </main>
    </div>

    <script>
      const url = "https://tpgroup.atlassian.net/servicedesk/";
      function openExternally() {
        if (window.microsoftTeams?.app?.openLink) {
          try { microsoftTeams.app.openLink(url); return; } catch (e) {}
        }
        try { window.open(url, "_blank", "noopener,noreferrer"); } catch (e) {}
      }
      document.getElementById("openJira").addEventListener("click", openExternally);
      (async () => {
        // Auto-apertura dopo initialize: apre nel browser esterno in Desktop, nuova scheda nel Web
        try { if (window.microsoftTeams?.app?.initialize) await microsoftTeams.app.initialize(); } catch (e) {}
        openExternally();
      })();
    </script>
  </body>
</html>
