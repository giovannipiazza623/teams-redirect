
<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8">
    <title>Apri Jira Service Management</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Stili minimi, nessuna classe riutilizzabile -->
    <style>
      html, body { margin:0; padding:0; font-family: Arial, Helvetica, sans-serif; color:#1a1a1a; background:#fff; }
      .wrap { min-height:100vh; display:flex; align-items:center; justify-content:center; text-align:center; padding:24px; box-sizing:border-box; }
      h1   { font-size:22px; margin:0 0 8px; }
      p    { margin:0 0 16px; color:#444; }
      /* Bottoni con stile inline e testo visibile */
      button {
        appearance: none;
        border: none;
        border-radius: 8px;
        background: #0078d4;
        color: #fff;            /* testo bianco su sfondo blu */
        font-weight: bold;
        padding: 12px 18px;
        cursor: pointer;
      }
      button:focus { outline: 3px solid rgba(0,120,212,.35); outline-offset: 2px; }
      /* Link testuale di fallback (sempre cliccabile) */
      a { color: #0078d4; text-decoration: underline; }
    </style>
    <!-- SDK Teams (solo per openLink su desktop; se non carica, usiamo window.open) -->
    <script src="https://res.cdn.office.net/teams-js/2.47.0/js/MicrosoftTeams.min.js"
            integrity="sha384-IkfULjDxwgKW <main aria-labelledby="title">
        <h1 id="title">Apri Jira Service Management</h1>
        <p>Clicca il pulsante qui sotto per aprire il portale nel browser.</p>

        <!-- BOTTONE PRINCIPALE -->
        <p>
          <button id="openJira" type="button">Apri Jira</button>
        </p>

        <!-- LINK DI FALLBACK (sempre cliccabile, testo visibile) -->
        <p>
          Oppure usa questo link:&nbsp;
          <a href/tpgroup.atlassian.net/servicedesk/https://tpgroup.atlassian.net/servicedesk/</a>
        </p>
      </main>
    </div>

    <script>
      const url = "https://tpgroup.atlassian.net/servicedesk/";
      const openExternally = () => {
        // Prova l’API Teams (desktop): apre fuori dal client
        if (window.microsoftTeams?.app?.openLink) {
          try { microsoftTeams.app.openLink(url); return; } catch(e) {}
        }
        // Fallback universale (web/desktop): nuova scheda
        try { window.open(url, "_blank", "noopener,noreferrer"); } catch(e) {}
      };

      document.getElementById("openJira").addEventListener("click", openExternally);

      // Inizializza SDK (se siamo davvero in una tab Teams); se fallisce, il bottone userà il fallback.
      (async () => {
        try { if (window.microsoftTeams?.app?.initialize) await microsoftTeams.app.initialize(); } catch(e) {}
      })();
    </script>
  </body>
</html>
