<body>
  <h1>Apri Jira Service Management</h1>
  <p>Stiamo aprendo Jira nel browser… Se non parte, clicca il bottone.</p>
  <button id="openJira">Apri Jira</button>
  <p>Oppure usa questo link:
    <a href="https://tpgroup.atlassian.net/servicedesk/" target="_up.atlassian.net/servicedesk/
    </a>
  </p>

  <script>
    const url = "https://tpgroup.atlassian.net/servicedesk/";
    function openExternally() {
      if (window.microsoftTeams?.app?.openLink) {
        microsoftTeams.app.openLink(url);
      } else {
        window.open(url, "_blank", "noopener,noreferrer");
      }
    }
    document.getElementById("openJira").addEventListener("click", openExternally);
    (async () => {
      try { await microsoftTeams.app.initialize(); } catch(e) {}
      openExternally(); // auto-apertura
    })();
  </script>
</body>
</html>
