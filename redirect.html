<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Apri Jira Service Management</title>
    <style>
      :root {
        --bg: #ffffff;
        --fg: #1a1a1a;
        --brand: #0078d4;
      }
      html, body {
        height: 100%;
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      }
      .wrap {
        min-height: 100%;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
        text-align: center;
      }
      h1 { font-size: 1.25rem; margin: 0 0 8px; }
      p  { margin: 0 0 16px; color: #444; }
      a.btn {
        display: inline-block;
        padding: 12px 18px;
        border-radius: 8px;
        background: var(--brand);
        color: #fff;
        text-decoration: none;
        font-weight: 600;
      }
      a.btn:focus { outline: 3px solid rgba(0,120,212,.35); outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main class="wrap" aria-labelledby="title">
      <div>
        <h1 id="title">Apri Jira Service Management</h1>
        <p>Clicca il pulsante qui sotto per aprire il portale nel browser.</p>
        <p>
          https://tpgroup.atlassian.net/servicedesk/
             Apri Jira
          </a>
        </p>
      </div>
    </main>
  </body>
</html>
