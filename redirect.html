
<!DOCTYPE html>
<html lang="it">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Apertura Atlassian</title>
<script src="https://res.cdn.office.net/teams-js/2osoftTeams.min.js</script>
<body>
  <p>Stiamo aprendo Atlassian in una nuova scheda. Se non parte, <a id="lnkgroup.atlassian.net/servicedesk/clicca qui</a>.</p>
  <script>
    const URL = "https://tpgroup.atlassian.net/servicedesk/";
    (async () => { try { await microsoftTeams.app.initialize(); } catch(e){}; 
      setTimeout(() => { const w = window.open(URL, "_blank", "noopener,noreferrer"); if(!w) document.getElementById("lnk").click(); }, 250);
    })();
  </script>
</body>
</html>
